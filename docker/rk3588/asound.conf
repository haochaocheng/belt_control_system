# ✅ 2026-01-23 19:30 [FIX 100.300.14] 使用 HDMI 音频（Card 0）
# 原因: pi@192.168.1.8 设备只有 HDMI 音频可用
# 方案: 直接使用 hw:0,0（rockchiphdmi0）
pcm.!default {
    type plug
    slave.pcm "dmixer"
}

# dmix 配置（使用 HDMI 音频 Card 0）
pcm.dmixer {
    type dmix
    ipc_key 1024
    slave {
        pcm "hw:0,0"         # ✅ 使用 Card 0 (HDMI 音频)
        # ✅ 2026-03-03 [Phase 7.47.73]: 扩大缓冲区，减少 GStreamer Buffer Underrun 风险
        # 旧值: buffer_time 200000 (200ms) - 太小，GStreamer 重采样稍慢即导致卡顿
        # 新值: buffer_time 400000 (400ms) - 给 GStreamer 更多容错时间
        # 此改动为安全底网：即使 QSoundEffect 方案生效，仍保留缓冲余量
        period_time 20000    # 20ms per period（不变）
        buffer_time 400000   # 200ms → 400ms（扩大缓冲，减少 Underrun）
        rate 48000           # 固定采样率 48kHz
    }
    bindings {
        0 0  # 左声道
        1 1  # 右声道
    }
}

# 控制设备配置（音量控制）
ctl.!default {
    type hw
    card 0  # ✅ 使用 Card 0 (HDMI 音频)
}

# ========================================
# 配置说明
# ========================================
# pcm.!default:
#   - type plug: 使用 ALSA plug 插件（自动格式转换）
#   - slave.pcm "dmixer": 使用 dmix 软件混音
#
# pcm.dmixer:
#   - type dmix: 软件混音（允许多个程序同时播放）
#   - slave.pcm "hw:0,0": HDMI 音频设备（Card 0 Device 0）
#
# ctl.!default:
#   - type hw: 直接硬件控制
#   - card 0: HDMI 音频声卡
#
# 设备映射（pi@192.168.1.8）:
#   - Card 0: HDMI 音频（rockchiphdmi0）← 默认设备
#   - Card 1: Loopback（虚拟回环设备，不用于播放）
#
# 注意:
#   - 如果设备有 ES8388（如 linaro@192.168.10.188），需要改回 hw:1,0
#   - 未来可以通过脚本自动检测硬件并生成配置文件
# ========================================
