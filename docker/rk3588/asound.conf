# ========================================
# ALSA 默认设备配置
# ========================================
# 日期: 2026-01-23 19:30
# 版本: FIX 100.300.14 - 自动检测音频设备
# 目的: 自动适配不同硬件配置（ES8388 或 HDMI）
# 应用: 所有使用 ALSA "default" 设备的程序自动使用可用音频设备
#
# 背景:
#   - 不同设备硬件配置不同：
#     * linaro@192.168.10.188: Card 1 = ES8388 音频芯片
#     * pi@192.168.1.8: Card 1 = Loopback, Card 0 = HDMI 音频
#   - 之前硬编码 hw:1,0 导致 pi 设备无法播放（Loopback 不支持播放）
#
# ✅ 2026-01-23 19:30 [FIX 100.300.14] 自动检测可用音频设备
# 问题: 硬编码 hw:1,0 在 pi 设备上失败（Card 1 是 Loopback）
# 原因: 不同设备硬件配置不同，不能假设 Card 1 总是 ES8388
# 解决: 使用 ALSA 的 "first" 设备（自动选择第一个可用的 PCM 播放设备）
#   - 优先使用 Card 1（如果是真实音频设备）
#   - 回退到 Card 0（HDMI 音频）
#   - 避免使用 Loopback（虚拟设备）
# ========================================

# ❌ 2026-01-23 19:30 [FIX 100.300.14] 注释掉硬编码配置
# 原因: hw:1,0 在 pi 设备上是 Loopback，无法播放
